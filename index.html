<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokemon Run&Bun — Interactive Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Pokemon Run&Bun — Interactive World Map</h1>
    <p class="subtitle">Explore the complete Pokemon world! Click buildings and caves to enter interiors. Huge credits to hazzabee for the pictures and Dekzeh for run and bun!</p>
  </header>

  <main>
    <div id="map" tabindex="0"></div>
    <aside id="info">
      <div id="breadcrumb">🗺️ World Map</div>
      <div id="current-map-info" class="map-stats"></div>
      
      <div class="navigation-controls">
  <button id="back-to-world" style="display:none;">← Back to World</button>
  <button id="show-world-view">🗺️ World View</button>
  <label class="toggle"><input type="checkbox" id="toggle-edit"/> Edit layout</label>
  <label class="toggle"><input type="checkbox" id="toggle-labels" checked/> Show labels</label>
  <button id="save-layout" title="Download updated world layout JSON">💾 Save layout</button>
      </div>

      <h3>Interior Maps</h3>
      <input type="text" id="interior-search" placeholder="Search interiors..." />
      <label class="toggle small"><input type="checkbox" id="search-all-images"/> Include world maps</label>
      <div class="scrollable-list">
        <ul id="interiors-list"></ul>
      </div>
      <label class="toggle"><input type="checkbox" id="toggle-include-interiors"/> Include interiors in world view</label>

    </aside>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <!-- Optional pre-bundled manifest for file:// usage; generated alongside data/maps.json -->
  <script src="data/maps.js"></script>
  <!-- Optional pre-bundled atlas for file:// usage; generated alongside data/world-atlas.json -->
  <script src="data/world-atlas.js"></script>
  <script src="app.js"></script>
</body>
</html>
